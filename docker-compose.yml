# FoodFlow — single docker-compose service (ADR-3).
# The React app is built at image build time and served by FastAPI; the
# SQLite database is persisted via the ./data bind mount.
services:
  foodflow:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    # GOOGLE_API_KEY flows host .env -> container environment -> backend
    # endpoint (NFR-1). Never hardcode a value here; see .env.example.
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}