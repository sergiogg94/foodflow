framework:
  name: conductor
  version: 0.1.0

project:
  name: FoodFlow
  slug: foodflow
  type: webapp
  description: Plan your weekly meals and groseries

features:
  github_projects: true
  opencode_commands: true
  documentation_scaffold: true
  ci_templates: true

# Concrete model used for each effort tier. Agents reference only a tier
# (model_tier below); the framework resolves it here at install time.
# Values follow the OpenCode format: provider/model-id.
model_tiers:
  low: opencode/big-pickle
  medium: opencode/big-pickle
  high: opencode/big-pickle

agents:
  orchestrator:
    enabled: true
    model_tier: medium
    can_update_projects: false

  discovery:
    enabled: true
    model_tier: low
    can_update_projects: false

  scopper:
    enabled: true
    model_tier: low
    can_update_projects: false

  planner:
    enabled: true
    model_tier: medium
    can_update_projects: true

  architect:
    enabled: true
    model_tier: medium
    can_update_projects: false

  developer:
    enabled: true
    model_tier: high
    can_update_projects: true

  reviewer:
    enabled: true
    model_tier: medium
    can_update_projects: false

  tester:
    enabled: true
    model_tier: medium
    can_update_projects: false

  devops:
    enabled: true
    model_tier: medium
    can_update_projects: true

  documenter:
    enabled: true
    model_tier: low
    can_update_projects: false

artifacts:
  discovery: docs/discovery.md
  requirements: docs/requirements.md
  implementation_plan: docs/implementation-plan.md
  architecture: docs/architecture.md
  delivery_checklist: docs/delivery-checklist.md
  adr_directory: docs/adr
  review_reports: docs/reviews
  test_reports: docs/tests
  implementation_notes: docs/notes

github:
  repository:
    owner: sergiogg94
    name: foodflow
    default_branch: main

  projects:
    enabled: true
    owner_type: organization
    owner: sergiogg94
    project_number: 2

    fields:
      status: Status
      priority: Priority
      type: Type
      area: Area
      effort: Effort
      iteration: Iteration
      linked_pr: Linked PR
      risk: Risk

    states:
      backlog: Backlog
      ready: Ready
      in_progress: In Progress
      review: Review
      blocked: Blocked
      done: Done

workflow:
  require_human_approval_for:
    - scope_changes
    - architecture_decisions
    - high_impact_code_changes
    - release_readiness

  default_path:
    - discovery
    - scopper
    - planner
    - architect
    - developer
    - tester
    - reviewer
    - documenter
