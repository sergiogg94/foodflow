on:
  push:
    branches: [main]
  pull_request:

jobs:
  baseline:
    name: Baseline checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Scaffold notice
        run: |
          echo "ci-baseline is a scaffold installed by the conductor framework."
